# migpt-cli Docker Compose 配置
# 支持两种部署模式：
#   1. 本地构建：docker-compose up --build
#   2. 拉取预构建镜像：docker-compose up

services:
  migpt-cli:
    # 镜像配置（二选一）
    # 方式1：本地构建（取消注释 build 部分，注释 image 行）
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    #   args:
    #     VERSION: ${VERSION:-dev}
    #     REVISION: ${REVISION:-unknown}

    # 方式2：拉取预构建镜像（默认）
    image: ${MIGPT_IMAGE:-registry.cn-hangzhou.aliyuncs.com/tcwmj/migpt-cli:latest}

    container_name: migpt-cli
    restart: unless-stopped

    ports:
      - '${PORT:-36597}:36597'

    volumes:
      - migpt-data:/home/node/.migptgui

    environment:
      - NODE_ENV=production
      - PORT=36597
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}

    # 健康检查
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:36597/ping']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    # 资源限制（可选）
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

volumes:
  migpt-data:
    driver: local
