name: Release to Aliyun ACR

# 推送到阿里云容器镜像服务
# 触发条件：与主 release 相同，tag 触发
#
# 需要配置的 GitHub Secrets：
#   ALIYUN_REGISTRY_USERNAME - 阿里云账号
#   ALIYUN_REGISTRY_PASSWORD - 阿里云密码或专用密码
#
# 镜像地址：registry.cn-hangzhou.aliyuncs.com/tcwmj/migpt-cli
# 支持标签：latest、版本号、v 前缀版本号、sha-<commit>

on:
  push:
    tags:
      - 'migptgui@*'

permissions:
  contents: read

env:
  # 阿里云容器镜像服务配置
  ALIYUN_REGISTRY: registry.cn-hangzhou.aliyuncs.com
  ALIYUN_NAMESPACE: tcwmj
  ALIYUN_REPO: migpt-cli

jobs:
  release-aliyun:
    name: Build & Push to Aliyun ACR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          ALIYUN_USER: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          [ -n "$ALIYUN_USER" ] || { echo "::error::缺少仓库 Secret：ALIYUN_REGISTRY_USERNAME"; exit 1; }
          [ -n "$ALIYUN_PASS" ] || { echo "::error::缺少仓库 Secret：ALIYUN_REGISTRY_PASSWORD"; exit 1; }

      - name: Resolve version & created
        id: ver
        run: |
          version="${GITHUB_REF_NAME#migptgui@}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPO }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=v${{ steps.ver.outputs.version }}
            type=raw,value=latest
            type=sha,format=long

      - name: Build & push (multi-arch)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.ver.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image (Trivy gate)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPO }}:${{ steps.ver.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Summary
        run: |
          echo "## 阿里云容器镜像发布成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**镜像地址：**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPO }}:${{ steps.ver.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPO }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**拉取命令：**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_NAMESPACE }}/${{ env.ALIYUN_REPO }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
