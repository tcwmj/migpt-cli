name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks 需要全历史提交才能扫描既往泄漏（fetch-depth: 0）
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # 依赖漏洞门禁：只卡生产依赖的 high/critical。
      # KNOWN 为上游未修复且无法在本仓库内安全降级绕过的公告（mi-gpt>=4.2 依赖链
      # proxy-agent→get-uri→basic-ftp 的 DoS；降级 mi-gpt 属破坏性变更）。
      # 上游修复或换依赖后，应从 KNOWN 清单移除对应 GHSA 使门禁恢复全覆盖。
      - name: Dependency audit (production, high+)
        run: |
          set -e
          # npm audit 发现漏洞时以退出码 1 结束：先捕获 JSON，判定交给门控脚本
          npm audit --omit=dev --audit-level=high --json > /tmp/audit.json || true
          node scripts/audit-gate.mjs /tmp/audit.json "GHSA-c475-qrg2-pj4r"

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Typecheck & Build (all workspaces)
        run: npm run build

  docker:
    name: Docker image (multi-arch)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    # 仅 main 且已配置 Docker Hub 凭据时推送；PR / develop 只做构建与扫描门禁
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build workspace
        run: npm run build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 漏洞门禁（G12）：先构建单架构镜像并载入本地，再交给 Trivy 扫描
      - name: Build image (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: migpt-cli:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 注意：Trivy 供应链事件后须使用安全版本（trivy-action >= 0.35.0）
      - name: Scan image (Trivy gate)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: migpt-cli:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push image (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/migpt-cli:latest', vars.DOCKERHUB_USERNAME) || 'migpt-cli:local' }}
            ${{ vars.DOCKERHUB_USERNAME != '' && format('{0}/migpt-cli:{1}', vars.DOCKERHUB_USERNAME, github.sha) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
