# Dependabot 自动依赖更新
version: 2
updates:
  # npm 依赖（根 + workspace）
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # 开发依赖分组更新（减少 PR 噪音）
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      # 生产依赖逐个更新（便于审查）
      production-dependencies:
        dependency-type: production

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  # Docker
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - docker
